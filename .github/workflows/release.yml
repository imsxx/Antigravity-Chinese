# 打 tag(如 v2.33.1)时,在云端 Windows 环境自动构建并发布 Release。
#
# 发布资产:
#   - antigravity-chinese-vX.Y.Z.zip(控制台工具 + 终端启动器 + 词典 + README)
#   - 设置与维护.exe / antigravity-cn.exe(独立下载)
#   - checksums.txt(SHA256,供启动器自更新校验)
#
# Release 说明 = CHANGELOG.md 中对应版本的段落 + 固定信息块。
name: 构建并发布

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 构建双入口工具并创建 Release
    runs-on: windows-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 验证与构建(版本号由 tag 注入)
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $tag = '${{ github.ref_name }}'
          $maintenance = '设置与维护.exe'
          go vet ./...
          go vet -tags launcher ./...
          go test ./... -count=1
          go test -tags launcher ./... -count=1
          go build -trimpath -ldflags "-s -w -X main.toolVersion=$tag" -o $maintenance .
          go build -trimpath -tags launcher -ldflags "-s -w -X main.toolVersion=$tag" -o antigravity-cn.exe .
          if (-not (Test-Path $maintenance)) { throw '构建失败:未生成维护工具 exe' }
          if (-not (Test-Path antigravity-cn.exe)) { throw '构建失败:未生成终端启动器' }
          $guiBytes = [IO.File]::ReadAllBytes((Resolve-Path antigravity-cn.exe))
          $peOffset = [BitConverter]::ToInt32($guiBytes, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($guiBytes, $peOffset + 24 + 68)
          if ($subsystem -ne 3) { throw "启动器不是控制台子系统: $subsystem" }
          $versionOutput = & ".\$maintenance" --version
          if ($versionOutput -notmatch [regex]::Escape($tag)) {
            throw "版本注入失败: $versionOutput"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "GO_VERSION=$(go env GOVERSION)" -Encoding utf8

      - name: 打包并生成 checksums
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $maintenance = '设置与维护.exe'
          $dir = "dist/antigravity-chinese-$tag"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $maintenance $dir/
          Copy-Item antigravity-cn.exe $dir/
          Copy-Item translations_settings.json $dir/
          Copy-Item README.md $dir/
          $zip = "antigravity-chinese-$tag.zip"
          Compress-Archive -Path $dir -DestinationPath $zip -Force

          # 仅校验独立资产;词典与 README 在 zip 内,由 zip 的 SHA256 覆盖。
          $assetNames = @(
            $maintenance,
            'antigravity-cn.exe',
            $zip
          )
          $lines = foreach ($name in $assetNames) {
            $hash = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $PWD 'checksums.txt'),
            [string[]]$lines,
            [Text.UTF8Encoding]::new($false)
          )

          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_NAME=$zip" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "ZIP_SHA256=$zipHash" -Encoding utf8

      - name: 生成中文 Release 说明
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $sha = '${{ github.sha }}'.Substring(0, 7)
          $repo = '${{ github.repository }}'

          # 从 CHANGELOG.md 提取本版本段落(人话版更新内容)
          $section = @()
          $in = $false
          $lines = @(Get-Content CHANGELOG.md -Encoding UTF8 -ErrorAction SilentlyContinue)
          foreach ($line in $lines) {
            if (-not $in) {
              if ($line -match "^##\s+$([regex]::Escape($tag))(\s|\(|$)") { $in = $true }
              continue
            }
            if ($line -match "^##\s") { break }
            $section += $line
          }
          $highlights = ($section -join "`n").Trim()
          if (-not $highlights) {
            $highlights = '本次发布未在 CHANGELOG.md 中找到对应版本的说明,更新内容详见仓库提交记录。'
          }

          $template = @'
          ## Antigravity CN {{TAG}}

          {{HIGHLIGHTS}}

          ---

          ### 推荐使用方式

          1. 完全退出 Antigravity 客户端(含托盘图标);
          2. 解压整个压缩包到固定目录(不要只复制 exe);
          3. 双击 `antigravity-cn.exe`。终端启动器会完整显示检查步骤,必要时安全汉化,然后打开客户端;
          4. 首次成功汉化后会在桌面创建 `Antigravity CN` 快捷方式,以后从这里启动即可。

          启动器每次都会检查本项目的稳定版 Release。发现新版本时可选择「立即更新 / 不更新启动 / 关闭更新检查」;
          更新在后台完成校验和回滚保护,不会改动 Antigravity 客户端本身。

          如果官方客户端更新后界面暂时变回英文,下一次从 `Antigravity CN` 启动时会自动重新汉化。

          ### 还原与维护

          双击 `设置与维护.exe` 可打开维护菜单:
          - 「2. 还原官方英文」无损还原;
          - 「3. 兼容性扫描」查看官方新版新增文案;
          - 「5. 创建/修复桌面快捷方式」修复启动器入口;
          - 「6. 关闭/重新开启自动更新检查」。

          也可以执行 `设置与维护.exe --restore`。

          ### 本次构建

          - 触发标签:{{TAG}}
          - 源码提交:[{{SHA}}](https://github.com/{{REPO}}/commit/{{SHA}})
          - 构建环境:windows-latest + {{GOVER}}
          - 压缩包 SHA256:`{{HASH}}`

          ### 文件清单

          - `antigravity-cn.exe` — 推荐入口:终端启动器,保留完整检查日志并自动检查更新与补丁
          - `设置与维护.exe` — 控制台维护工具:应用 / 还原 / 扫描 / 验证
          - `translations_settings.json` — 翻译词典,可自行修改
          - `README.md` — 完整说明
          - `checksums.txt` — 发布资产 SHA256(启动器自更新校验使用)

          ### 注意事项

          - 首次运行如遇 Windows SmartScreen 提示,点「更多信息」→「仍要运行」即可(未签名程序的常规提示);
          - 启动器只检查本项目 GitHub Release,不发送遥测、账号或客户端数据;
          - 工具只翻译界面文案,不触碰账号、配额、认证与任何业务逻辑;修改客户端本地资源可能违反其服务条款,请自行评估风险。
          '@
          $notes = $template.Replace('{{TAG}}', $tag)
          $notes = $notes.Replace('{{HIGHLIGHTS}}', $highlights)
          $notes = $notes.Replace('{{SHA}}', $sha)
          $notes = $notes.Replace('{{REPO}}', $repo)
          $notes = $notes.Replace('{{GOVER}}', $env:GO_VERSION)
          $notes = $notes.Replace('{{HASH}}', $env:ZIP_SHA256)
          [IO.File]::WriteAllText("$PWD/release_notes.md", $notes, [Text.UTF8Encoding]::new($false))

      - name: 创建或更新 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = $env:ZIP_NAME
          $maintenance = '设置与维护.exe'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host '该标签已有 Release,更新说明并覆盖上传资产。'
            gh release edit $tag --title "$tag Antigravity CN 启动器" --notes-file release_notes.md
            gh release upload $tag $zip $maintenance antigravity-cn.exe checksums.txt --clobber
          } else {
            gh release create $tag $zip $maintenance antigravity-cn.exe checksums.txt --title "$tag Antigravity CN 启动器" --notes-file release_notes.md
          }
